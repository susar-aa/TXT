<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Chat</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>

<div class="container-fluid p-0 h-100 d-flex overflow-hidden">
    
    <!-- Sidebar (Hidden on mobile by default) -->
    <div class="sidebar border-end d-flex flex-column bg-body-tertiary" id="sidebar">
        <!-- Sidebar Header -->
        <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <div class="avatar bg-primary text-white rounded-circle me-2 d-flex justify-content-center align-items-center fw-bold" id="currentUserAvatar">?</div>
                <div>
                    <div class="fw-bold" id="currentUserName">Loading...</div>
                    <div class="text-success small"><i class="bi bi-circle-fill" style="font-size: 0.5rem;"></i> Online</div>
                </div>
            </div>
            <div class="dropdown">
                <button class="btn btn-sm btn-light border-0" type="button" data-bs-toggle="dropdown">
                    <i class="bi bi-three-dots-vertical"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                    <li><a class="dropdown-item d-flex align-items-center" href="#" id="toggleThemeBtn"><i class="bi bi-moon me-2"></i> Toggle Theme</a></li>
                    <li><a class="dropdown-item d-flex align-items-center" href="#" id="enableNotificationsBtn"><i class="bi bi-bell me-2"></i> Enable Notifications</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger d-flex align-items-center" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
                </ul>
            </div>
        </div>

        <!-- Conversations List (Only 1 for Version 1) -->
        <div class="flex-grow-1 overflow-y-auto">
            <div class="conversation-item p-3 border-bottom d-flex align-items-center active cursor-pointer" id="activeConversation">
                <div class="position-relative">
                    <div class="avatar bg-secondary text-white rounded-circle me-3 d-flex justify-content-center align-items-center fw-bold fs-5" id="friendAvatarSidebar">?</div>
                    <span class="position-absolute bottom-0 end-0 p-1 bg-secondary border border-light rounded-circle" id="friendStatusIndicator">
                        <span class="visually-hidden">New alerts</span>
                    </span>
                </div>
                <div class="flex-grow-1 overflow-hidden">
                    <div class="d-flex justify-content-between align-items-baseline mb-1">
                        <div class="fw-bold text-truncate" id="friendNameSidebar">Loading...</div>
                    </div>
                    <div class="text-muted small text-truncate" id="lastMessageSidebar">No messages yet</div>
                </div>
                <div class="ms-2 text-end">
                    <span class="badge bg-primary rounded-pill d-none" id="unreadBadgeSidebar">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="chat-main d-flex flex-column flex-grow-1 bg-body">
        
        <!-- Chat Header -->
        <header class="p-3 border-bottom d-flex justify-content-between align-items-center bg-body-tertiary">
            <div class="d-flex align-items-center">
                <!-- Mobile Toggle Button -->
                <button class="btn btn-light d-md-none me-2" id="mobileMenuBtn">
                    <i class="bi bi-list"></i>
                </button>
                
                <div class="position-relative">
                    <div class="avatar bg-secondary text-white rounded-circle me-3 d-flex justify-content-center align-items-center fw-bold fs-5" id="friendAvatarHeader">?</div>
                </div>
                <div>
                    <div class="fw-bold fs-5 lh-1" id="friendNameHeader">Loading...</div>
                    <div class="small text-muted mt-1" id="friendStatusText">Checking status...</div>
                </div>
            </div>
            
            <div class="d-flex align-items-center">
                <div class="search-container position-relative me-2 d-none d-md-block" id="searchContainer">
                    <input type="text" class="form-control form-control-sm rounded-pill pe-4" id="searchInput" placeholder="Search messages...">
                    <i class="bi bi-x-circle-fill position-absolute text-muted cursor-pointer d-none" id="clearSearchBtn" style="right: 10px; top: 50%; transform: translateY(-50%);"></i>
                </div>
                <button class="btn btn-light rounded-circle d-md-none" id="mobileSearchBtn">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </header>

        <!-- Search Results Panel (Hidden by default) -->
        <div class="bg-body-tertiary border-bottom p-2 d-none" id="searchResultsPanel">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="small fw-bold text-muted">Search Results</span>
                <button class="btn-close" style="font-size: 0.7rem;" id="closeSearchBtn"></button>
            </div>
            <div id="searchResultsList" class="search-results-list overflow-y-auto" style="max-height: 200px;">
                <!-- Results go here -->
            </div>
        </div>

        <!-- Messages Area -->
        <div class="messages-container flex-grow-1 p-3 overflow-y-auto position-relative" id="messagesArea">
            <div class="text-center my-4 d-none" id="loadingHistory">
                <div class="spinner-border text-primary spinner-border-sm" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
            
            <div id="messagesList" class="d-flex flex-column">
                <!-- Messages will be injected here -->
            </div>
        </div>

        <!-- Composer Area -->
        <footer class="p-3 border-top bg-body-tertiary position-relative">
            
            <!-- Reply/Edit Preview -->
            <div class="reply-preview d-none p-2 mb-2 bg-body rounded border position-relative" id="composerPreview">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="small fw-bold text-primary" id="previewTitle">Replying to Sus</div>
                    <button type="button" class="btn-close" style="font-size: 0.6rem;" id="closePreviewBtn" aria-label="Close"></button>
                </div>
                <div class="small text-truncate text-muted mt-1" id="previewText">...</div>
            </div>

            <div class="d-flex align-items-end">
                <textarea class="form-control form-control-lg me-2 border-0 shadow-sm" id="messageInput" rows="1" placeholder="Type a message..." style="resize: none; max-height: 150px; overflow-y: hidden; border-radius: 20px; padding: 12px 20px;"></textarea>
                <button class="btn btn-primary rounded-circle shadow-sm flex-shrink-0" id="sendBtn" style="width: 48px; height: 48px;">
                    <i class="bi bi-send-fill"></i>
                </button>
            </div>
            <div class="text-muted small mt-1 text-center d-none d-md-block" style="font-size: 0.7rem;">
                Press <kbd>Enter</kbd> to send, <kbd>Shift + Enter</kbd> for new line.
            </div>
        </footer>
        
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Application Scripts -->
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/notifications.js"></script>
<script src="js/messages.js"></script>
<script src="js/realtime.js"></script>
<script src="js/search.js"></script>
<script src="js/chat.js"></script>

</body>
</html>
