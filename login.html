<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Select User - Private Chat</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary">

<main class="form-signin w-100 m-auto">
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-chat-quote-fill text-primary mb-3" viewBox="0 0 16 16">
                    <path d="M16 8c0 3.866-3.582 7-8 7a9.06 9.06 0 0 1-2.347-.306c-.584.296-1.925.864-4.181 1.234-.2.032-.352-.176-.273-.362.354-.836.674-1.95.77-2.966C.744 11.37 0 9.76 0 8c0-3.866 3.582-7 8-7s8 3.134 8 7zM7.194 6.766a1.688 1.688 0 0 0-.227-.272 1.467 1.467 0 0 0-.469-.324l-.008-.004A1.785 1.785 0 0 0 5.734 6C4.776 6 4 6.746 4 7.667c0 .92.776 1.666 1.734 1.666.343 0 .662-.095.931-.26-.137.389-.39.804-.81 1.22a.405.405 0 0 0 .274.719c1.071-0 1.748-.671 2.242-1.687.202-.415.33-.865.33-1.299 0-.434-.128-.884-.33-1.299-.047-.097-.101-.19-.158-.282zm4.004 0a1.688 1.688 0 0 0-.227-.272 1.467 1.467 0 0 0-.469-.324l-.008-.004A1.785 1.785 0 0 0 9.734 6C8.776 6 8 6.746 8 7.667c0 .92.776 1.666 1.734 1.666.343 0 .662-.095.931-.26-.137.389-.39.804-.81 1.22a.405.405 0 0 0 .274.719c1.071-0 1.748-.671 2.242-1.687.202-.415.33-.865.33-1.299 0-.434-.128-.884-.33-1.299-.047-.097-.101-.19-.158-.282z"/>
                </svg>
                <h1 class="h3 mb-3 fw-bold">Private Chat</h1>
                <p class="text-muted">Who are you?</p>
            </div>

            <div class="d-grid gap-3">
                <button class="btn btn-outline-primary btn-lg" onclick="loginAs('11111111-1111-1111-1111-111111111111')">
                    I am Sus
                </button>
                <button class="btn btn-outline-success btn-lg" onclick="loginAs('22222222-2222-2222-2222-222222222222')">
                    I am Nethuki
                </button>
            </div>
        </div>
    </div>
</main>

<script>
    // Redirect if already "logged in"
    if (localStorage.getItem('chatUserId')) {
        window.location.href = 'chat.html';
    }

    function loginAs(userId) {
        localStorage.setItem('chatUserId', userId);
        window.location.href = 'chat.html';
    }
</script>
</body>
</html>
